name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed bundle and npm copy match the source
        run: git diff --exit-code plugins/claude-referee/dist npm

  windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
      - name: Bundle runs without node_modules on the oldest supported Node
        run: |
          tmp="$(mktemp -d)"
          cp -R plugins/claude-referee "$tmp/"
          cli="$tmp/claude-referee/dist/cli.mjs"
          for c in done decide judge claims verify receipts doctor eval; do
            node "$cli" "$c" --describe | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))' || { echo "describe failed: $c"; exit 1; }
          done
          echo 'not json' | node "$tmp/claude-referee/dist/hook.mjs" session-start
          size=$(cat "$tmp"/claude-referee/dist/*.mjs | wc -c)
          echo "bundle bytes: $size"
          test "$(wc -c < "$tmp/claude-referee/dist/cli.mjs")" -lt 450000
          test "$(wc -c < "$tmp/claude-referee/dist/hook.mjs")" -lt 200000
      - name: Hook start latency stays within 40 ms of a bare node at p95
        run: node scripts/hook-latency.mjs
      - name: Recorded evals score within each suite's allowance (offline, no key)
        run: node plugins/claude-referee/dist/cli.mjs eval score --suite all --fail-on violated

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      # Only the known reserved-name error for claude-referee is ignored; see CHANGELOG.
      - run: node scripts/validate-plugin.mjs
      - run: node scripts/validate-plugin.mjs --self-test

  private-terms:
    runs-on: ubuntu-latest
    env:
      REFEREE_PRIVATE_TERMS: ${{ secrets.REFEREE_PRIVATE_TERMS }}
    steps:
      - uses: actions/checkout@v7
      - name: No private terms in the repository
        if: env.REFEREE_PRIVATE_TERMS != ''
        run: bash scripts/check-no-private.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 over the whole history (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
